<!-- ========================================
     index.html START
     Project Map
======================================== -->

<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <!--
    viewport
    iPhoneの画面幅に合わせる。
    viewport-fit=cover はノッチ等の安全領域にも対応。
  -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>Project Map</title>

  <!--
    v=20 はキャッシュ対策。
    CSSを更新したのにiPhoneで古いものが
    表示される事故を減らす。
  -->
  <link
    rel="stylesheet"
    href="style.css?v=20"
  >
</head>


<body>

  <!-- ========================================
       アプリ全体
  ======================================== -->
  <div class="app">


    <!-- ========================================
         ヘッダー
    ======================================== -->
    <header class="app-header">

      <div class="header-title">

        <p class="app-name">
          Project Map
        </p>

        <h1 id="project-title">
          サンプルプロジェクト
        </h1>

      </div>


      <!--
        現時点では将来用のメニューボタン。
        既存デザインを残している。
      -->
      <button
        type="button"
        class="project-menu-button"
        id="project-menu-button"
        aria-label="プロジェクトメニュー"
      >
        ⋯
      </button>

    </header>


    <!-- ========================================
         メイン画面
    ======================================== -->
    <main class="main-content">


      <!-- ========================================
           ロードマップ
      ======================================== -->
      <section
        class="roadmap-section"
        aria-label="プロジェクトロードマップ"
      >

        <div class="roadmap-header">

          <div>

            <p class="section-label">
              ROADMAP
            </p>

            <h2>
              完成までの道のり
            </h2>

          </div>


          <button
            type="button"
            class="add-milestone-button"
            id="add-milestone-button"
          >
            ＋ マイルストーン
          </button>

        </div>


        <!--
          マイルストーンはscript.jsが作成する。

          ・保存データあり
              → 保存内容を復元

          ・保存データなし
              → 初期サンプルを表示
        -->
        <div
          class="roadmap"
          id="roadmap"
          aria-label="マイルストーン一覧"
        ></div>

      </section>


      <!-- ========================================
           現在地・進捗
      ======================================== -->
      <aside
        class="progress-panel"
        aria-label="現在の進捗"
      >

        <div class="progress-card">

          <p class="section-label">
            CURRENT
          </p>

          <h2>
            現在地
          </h2>


          <!-- 現在マイルストーン -->
          <div class="current-milestone">

            <span class="current-milestone-icon">
              🧭
            </span>

            <div>

              <span class="small-label">
                現在のマイルストーン
              </span>

              <strong>
                -
              </strong>

            </div>

          </div>


          <!-- 全体進捗 -->
          <div class="progress-area">

            <div class="progress-title">

              <span>
                全体進捗
              </span>

              <strong id="progress-percent">
                0%
              </strong>

            </div>


            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >

              <div class="progress-bar-fill"></div>

            </div>

          </div>


          <!-- 今のタスク -->
          <div class="current-task-box">

            <span class="small-label">
              今やっていること
            </span>

            <strong>
              現在のタスクはありません
            </strong>

          </div>


          <!-- 次のタスク -->
          <div class="next-task-box">

            <span class="small-label">
              次にやること
            </span>

            <strong>
              次のタスクはありません
            </strong>

          </div>

        </div>

      </aside>

    </main>


    <!-- ========================================
         状態の凡例
    ======================================== -->
    <footer class="status-legend">

      <div class="legend-item">
        <span class="legend-dot legend-complete"></span>
        完了
      </div>

      <div class="legend-item">
        <span class="legend-dot legend-current"></span>
        今やっている
      </div>

      <div class="legend-item">
        <span class="legend-dot legend-next"></span>
        次にやる
      </div>

      <div class="legend-item">
        <span class="legend-dot legend-future"></span>
        未着手
      </div>

    </footer>

  </div>


  <!--
    JavaScript。
    CSS同様、v=20で古いキャッシュを避ける。
  -->
  <script src="script.js?v=20"></script>

</body>

</html>

<!-- ========================================
     index.html END
======================================== -->
