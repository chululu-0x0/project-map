<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Project Map</title>
  <link rel="stylesheet" href="style.css?v=31">
</head>

<body>
  <div class="app">
    <!-- ========================================
         ▼ タイトル・全体進捗 ここから
    ======================================== -->
    <header class="app-header">
      <div class="header-title">
        <p class="app-name">Project Map</p>

        <h1
          id="project-title"
          role="button"
          tabindex="0"
          aria-label="プロジェクト名を編集"
          title="クリックしてプロジェクト名を編集"
        >サンプルプロジェクト</h1>

        <div class="title-progress" aria-label="全体進捗">
          <div class="title-progress-meta">
            <span>全体進捗</span>
            <strong id="progress-percent">0%</strong>
          </div>

          <div
            class="progress-bar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="progress-bar-fill"></div>
          </div>
        </div>
      </div>
</header>

    <main class="main-content">
      <section
        class="roadmap-section"
        aria-label="プロジェクトロードマップ"
      >
        <!-- ========================================
             ▼ ロードマップ操作ボタン ここから
        ======================================== -->
        <div class="roadmap-tools">
          <button
            type="button"
            class="add-milestone-button"
            id="add-milestone-button"
          >＋ マイルストーン</button>

          <button
            type="button"
            class="project-menu-button roadmap-menu-button"
            id="project-menu-button"
            aria-label="プロジェクトメニュー"
          >⋯</button>
        </div>
        <!-- ========================================
             ▲ ロードマップ操作ボタン ここまで
        ======================================== -->

        <div class="roadmap-frame">
          <div
            class="roadmap"
            id="roadmap"
            aria-label="マイルストーン一覧"
          ></div>
        </div>
      </section>

      <aside
        class="task-memo-panel"
        id="task-memo-panel"
        aria-label="選択中タスクのメモ"
      >
        <div class="task-memo-card">
          <button
            type="button"
            class="task-memo-header"
            id="task-memo-toggle"
            aria-expanded="false"
          >
            <span class="task-memo-heading">
              <span class="section-label">TASK MEMO</span>
              <strong
                class="task-memo-task-name"
                id="task-memo-task-name"
              >タスクを選択</strong>
            </span>

            <span
              class="task-memo-chevron"
              aria-hidden="true"
            >⌃</span>
          </button>

          <textarea
            id="task-memo-input"
            class="task-memo-input"
            placeholder="タスク名に書ききれないことをここにメモできます。"
            rows="8"
            disabled
          ></textarea>

          <p
            class="task-memo-empty"
            id="task-memo-empty"
          >タスクを選択すると、そのタスクのメモが表示されます。</p>
        </div>
      </aside>
    </main>
    <!-- ========================================
         ▲ メイン表示エリア ここまで
    ======================================== -->
</div>

  <script src="script.js?v=31"></script>
</body>
</html>
