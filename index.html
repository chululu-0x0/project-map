<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <!-- ========================================
       ▼ 画面・iPhone設定 ここから
  ======================================== -->

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>Project Map</title>

  <!-- ========================================
       ▲ 画面・iPhone設定 ここまで
  ======================================== -->


  <!-- ========================================
       ▼ CSS読み込み ここから

       v=21
       iPhoneに古いCSSが残るのを避けるための
       キャッシュ対策。
  ======================================== -->

  <link
    rel="stylesheet"
    href="style.css?v=21"
  >

  <!-- ========================================
       ▲ CSS読み込み ここまで
  ======================================== -->
</head>


<body>

  <div class="app">


    <!-- ========================================
         ▼ ヘッダー ここから

         「ROADMAP」
         「完成までの道のり」
         は今回削除。

         Project Map と
         プロジェクトタイトルだけ残す。
    ======================================== -->

    <header class="app-header">

      <div class="header-title">

        <p class="app-name">
          Project Map
        </p>

        <h1 id="project-title">
          サンプルプロジェクト
        </h1>

      </div>


      <button
        type="button"
        class="project-menu-button"
        id="project-menu-button"
        aria-label="プロジェクトメニュー"
      >
        ⋯
      </button>

    </header>

    <!-- ========================================
         ▲ ヘッダー ここまで
    ======================================== -->


    <!-- ========================================
         ▼ メイン画面 ここから
    ======================================== -->

    <main class="main-content">


      <!-- ========================================
           ▼ ロードマップ ここから
      ======================================== -->

      <section
        class="roadmap-section"
        aria-label="プロジェクトロードマップ"
      >

        <!--
          マイルストーン追加ボタンだけ
          ロードマップ上部へ残す。
        -->
        <div class="roadmap-tools">

          <button
            type="button"
            class="add-milestone-button"
            id="add-milestone-button"
          >
            ＋ マイルストーン
          </button>

        </div>


        <!--
          中身は script.js が作る。

          保存データあり
          → 保存内容を復元

          保存データなし
          → 初期サンプルを表示
        -->
        <div
          class="roadmap"
          id="roadmap"
          aria-label="マイルストーン一覧"
        ></div>

      </section>

      <!-- ========================================
           ▲ ロードマップ ここまで
      ======================================== -->


      <!-- ========================================
           ▼ 現在地・進捗 ここから
      ======================================== -->

      <aside
        class="progress-panel"
        aria-label="現在の進捗"
      >

        <div class="progress-card">

          <p class="section-label">
            CURRENT
          </p>

          <h2>
            現在地
          </h2>


          <!-- 現在マイルストーン -->
          <div class="current-milestone">

            <span class="current-milestone-icon">
              🧭
            </span>

            <div>

              <span class="small-label">
                現在のマイルストーン
              </span>

              <strong>
                -
              </strong>

            </div>

          </div>


          <!-- 全体進捗 -->
          <div class="progress-area">

            <div class="progress-title">

              <span>
                全体進捗
              </span>

              <strong id="progress-percent">
                0%
              </strong>

            </div>


            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >

              <div class="progress-bar-fill"></div>

            </div>

          </div>


          <!-- 今 -->
          <div class="current-task-box">

            <span class="small-label">
              今やっていること
            </span>

            <strong>
              現在のタスクはありません
            </strong>

          </div>


          <!-- 次 -->
          <div class="next-task-box">

            <span class="small-label">
              次にやること
            </span>

            <strong>
              次のタスクはありません
            </strong>

          </div>

        </div>

      </aside>

      <!-- ========================================
           ▲ 現在地・進捗 ここまで
      ======================================== -->

    </main>

    <!-- ========================================
         ▲ メイン画面 ここまで
    ======================================== -->


    <!-- ========================================
         ▼ 状態凡例 ここから
    ======================================== -->

    <footer class="status-legend">

      <div class="legend-item">
        <span class="legend-dot legend-complete"></span>
        完了
      </div>

      <div class="legend-item">
        <span class="legend-dot legend-current"></span>
        今やっている
      </div>

      <div class="legend-item">
        <span class="legend-dot legend-next"></span>
        次にやる
      </div>

      <div class="legend-item">
        <span class="legend-dot legend-future"></span>
        未着手
      </div>

    </footer>

    <!-- ========================================
         ▲ 状態凡例 ここまで
    ======================================== -->

  </div>


  <!-- ========================================
       ▼ JavaScript読み込み ここから
  ======================================== -->

  <script src="script.js?v=21"></script>

  <!-- ========================================
       ▲ JavaScript読み込み ここまで
  ======================================== -->

</body>

</html>
